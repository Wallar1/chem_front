# copied from https://github.com/ehemmerlin/svelter

services:
    chem:
        # image: 627023082830.dkr.ecr.us-west-1.amazonaws.com/chem:latest
        build:
            # you need to have the context outside of web_app so you can copy ./scripts
            context: ./web_app
        # Bind-mount source for live edit. Keep node_modules in a named Linux
        # volume: Rancher Desktop's fuse.sshfs host mount cannot read npm's
        # .bin symlinks (readlink → EPERM → "rollup: Operation not permitted").
        volumes:
            - ./web_app:/web_app:delegated
            - chem_node_modules:/web_app/node_modules
        # Install into the volume on start (no-op when lockfile is unchanged).
        command: sh -c "npm install && npm run dev"
        ports:
            - "8082:8082"
            - "35729:35729"  # Expose livereload port
        environment:
            - NODE_ENV=development
            - CHOKIDAR_USEPOLLING=true
            # - PORT=8080
            # - HOST=0.0.0.0
        networks:
            mynet:

    # nginx_rev:
    #     container_name: nginx_rev
    #     hostname: nginx_rev
